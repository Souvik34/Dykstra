      x2="113"
      y2="113"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0%" stop-color="#06B6F5"/>
      <stop offset="50%" stop-color="#1688F2"/>
      <stop offset="100%" stop-color="#7048F5"/>
